  <style type="text/css">
    @font-face {
        font-family: 'ChosunGs';
        src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@1.0/ChosunGs.woff') format('woff');
        font-weight: normal;
        font-style: normal;
    }

    body {
      font-family: 'ChosunGs', 'gungsuh', sans-serif !important;
    }
  </style>
  <script>
    const MAX_LENGTH = 4;

    // 이모지·결합 문자를 한 글자로 세기 위해 grapheme 단위로 분리
    const segmenter = 'Segmenter' in Intl ? new Intl.Segmenter('ko', { granularity: 'grapheme' }) : null;
    const toChars = (text) => segmenter
      ? Array.from(segmenter.segment(text), (s) => s.segment)
      : Array.from(text);

    // 배경 이미지와 폰트는 한 번만 불러와서 재사용
    const baseImage = new Image();
    baseImage.crossOrigin = "anonymous";
    const baseImageReady = new Promise((resolve, reject) => {
      baseImage.onload = resolve;
      baseImage.onerror = reject;
    });
    baseImage.src = "./static/congrats.jpg";
    const fontReady = document.fonts.load('bold 48px ChosunGs').catch(() => {});

    // 가장 최근 요청만 그리도록 하는 순번
    let renderId = 0;

    document.addEventListener("DOMContentLoaded", () => {
      document.querySelector('form').addEventListener('submit', (event) => { event.preventDefault(); });
      let input = document.getElementById('floating-input');
      input.addEventListener('input', (event) => { handleInput(input, event.isComposing) });
      input.addEventListener('compositionend', () => { handleInput(input, false) });
    });

    function handleInput(input, isComposing) {
      let chars = toChars(input.value.normalize('NFC'));

      if (chars.length > MAX_LENGTH) {
        input.classList.add('is-invalid');
        chars = chars.slice(0, MAX_LENGTH);
        // 한글 조합 중에 값을 바꾸면 조합이 깨지므로 조합이 끝난 뒤에 자름
        if (!isComposing) {
          input.value = chars.join('');
        }
      } else {
        input.classList.remove('is-invalid');
      }

      if (chars.join('').trim().length === 0) {
        resetCanvas();
        return;
      }

      updateCanvas(chars);
    }

    function setSaveButtonVisible(visible) {
      document.getElementById('save-button').style.display = visible ? 'block' : 'none';
    }

    function setStatus(message) {
      document.getElementById('status').textContent = message;
    }

    function resetCanvas() {
      renderId++;
      setSaveButtonVisible(false);
      const oldCanvas = document.getElementById('canvas');
      const newCanvas = document.createElement('canvas');
      newCanvas.id = 'canvas';
      oldCanvas.parentNode.replaceChild(newCanvas, oldCanvas);
    }

    async function updateCanvas(chars) {
      const id = ++renderId;
      setSaveButtonVisible(false);

      try {
        await Promise.all([baseImageReady, fontReady]);
      } catch {
        setStatus('이미지를 불러오지 못했습니다. 새로고침 후 다시 시도해주세요.');
        return;
      }

      if (id !== renderId) {
        return;
      }

      let canvas = document.getElementById('canvas');
      let context = canvas.getContext('2d');
      canvas.width = 1024;
      canvas.height = baseImage.height * (1024 / baseImage.width);
      context.drawImage(baseImage, 0, 0, canvas.width, canvas.height);
      drawTextOnCanvas(context, chars);
      setStatus('');
      setSaveButtonVisible(true);
    }

    function drawTextOnCanvas(context, text) {
      if (text.length === 1) {
        context.font = 'bold 46px ChosunGs';
        context.fillStyle = '#101010';
        context.transform(1, -0.025, 0, 1, 70, 9);
        context.fillText(text[0], 300, 250);
      } else if (text.length === 2) {
        context.font = 'bold 44px ChosunGs';
        context.fillStyle = '#101010';
        context.transform(1, -0.025, 0, 1, 40, 9);
        context.fillText(text[0], 300, 250);
        context.font = 'bold 48px ChosunGs';
        context.fillStyle = '#101010';
        context.transform(1, -0.025, 0, 1, 70, 8);
        context.fillText(text[1], 300, 250);
      } else if (text.length === 3) {
        context.font = 'bold 42px ChosunGs';
        context.fillStyle = '#101010';
        context.transform(1, -0.025, 0, 1, 0, 10);
        context.fillText(text[0], 300, 250);
        context.font = 'bold 46px ChosunGs';
        context.fillStyle = '#101010';
        context.transform(1, -0.025, 0, 1, 70, 9);
        context.fillText(text[1], 300, 250);
        context.font = 'bold 48px ChosunGs';
        context.fillStyle = '#101010';
        context.transform(1, -0.025, 0, 1, 76, 9);
        context.fillText(text[2], 300, 250);
      } else if (text.length === 4) {
        context.font = 'bold 40px ChosunGs';
        context.fillStyle = '#101010';
        context.transform(1, -0.025, 0, 1, -30, 10);
        context.fillText(text[0], 300, 250);
        context.font = 'bold 42px ChosunGs';
        context.fillStyle = '#101010';
        context.transform(1, -0.025, 0, 1, 70, 9);
        context.fillText(text[1], 300, 250);
        context.font = 'bold 46px ChosunGs';
        context.fillStyle = '#101010';
        context.transform(1, -0.025, 0, 1, 72, 9);
        context.fillText(text[2], 300, 250);
        context.font = 'bold 48px ChosunGs';
        context.fillStyle = '#101010';
        context.transform(1, -0.025, 0, 1, 76, 12);
        context.fillText(text[3], 300, 250);
      }
    }
    
    function exportCanvasAsPNG(id, fileName) {
      var canvasElement = document.getElementById(id);
      var MIME_TYPE = "image/png";
      var imgURL = canvasElement.toDataURL(MIME_TYPE);

      var dlLink = document.createElement('a');
      dlLink.download = fileName;
      dlLink.href = imgURL;
      dlLink.dataset.downloadurl = [MIME_TYPE, dlLink.download, dlLink.href].join(':');

      document.body.appendChild(dlLink);
      dlLink.click();
      document.body.removeChild(dlLink);
    }
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

<body>
  <div class="container">
    <h2 class="mt-3">🎉 축하합니다 짤 생성기 🎉</h2>
    <form class="form-floating mt-3">
      <input type="text" class="form-control" id="floating-input">
      <label for="floating-input">이름 (4글자까지 가능)</label>
    </form>
    <div id="status" class="text-danger mt-2" aria-live="polite"></div>
    <div class="row mt-3">
      <canvas id="canvas"></canvas>
    </div>
    <div class="row mt-3" id="save-button" style="display: none">
      <button class="btn btn-primary" onclick="exportCanvasAsPNG('canvas', '축하합니다_' + document.getElementById('floating-input').value.trim() + '.png')">저장하기</button>
    </div>
    <footer class="mt-3">
      <small>
        Made by gwanryo · <a href="https://github.com/gwanryo/congrats-for-no-reason" target="_blank">GitHub</a> · <a href="https://www.fmkorea.com/best/2594426530" target="_blank">Original</a> · <a href="https://noonnu.cc/font_page/416" target="_blank">Font</a>
      </small>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script>
    /*!
     * Color mode toggler for Bootstrap's docs (https://getbootstrap.com/)
     * Copyright 2011-2024 The Bootstrap Authors
     * Licensed under the Creative Commons Attribution 3.0 Unported License.
     */

    (() => {
      'use strict'

      const getStoredTheme = () => localStorage.getItem('theme')
      const setStoredTheme = theme => localStorage.setItem('theme', theme)

      const getPreferredTheme = () => {
        const storedTheme = getStoredTheme()
        if (storedTheme) {
          return storedTheme
        }

        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }

      const setTheme = theme => {
        if (theme === 'auto') {
          document.documentElement.setAttribute('data-bs-theme', (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'))
        } else {
          document.documentElement.setAttribute('data-bs-theme', theme)
        }
      }

      setTheme(getPreferredTheme())

      const showActiveTheme = (theme, focus = false) => {
        const themeSwitcher = document.querySelector('#bd-theme')

        if (!themeSwitcher) {
          return
        }

        const themeSwitcherText = document.querySelector('#bd-theme-text')
        const activeThemeIcon = document.querySelector('.theme-icon-active use')
        const btnToActive = document.querySelector(`[data-bs-theme-value="${theme}"]`)
        const svgOfActiveBtn = btnToActive.querySelector('svg use').getAttribute('href')

        document.querySelectorAll('[data-bs-theme-value]').forEach(element => {
          element.classList.remove('active')
          element.setAttribute('aria-pressed', 'false')
        })

        btnToActive.classList.add('active')
        btnToActive.setAttribute('aria-pressed', 'true')
        activeThemeIcon.setAttribute('href', svgOfActiveBtn)
        const themeSwitcherLabel = `${themeSwitcherText.textContent} (${btnToActive.dataset.bsThemeValue})`
        themeSwitcher.setAttribute('aria-label', themeSwitcherLabel)

        if (focus) {
          themeSwitcher.focus()
        }
      }

      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        const storedTheme = getStoredTheme()
        if (storedTheme !== 'light' && storedTheme !== 'dark') {
          setTheme(getPreferredTheme())
        }
      })

      window.addEventListener('DOMContentLoaded', () => {
        showActiveTheme(getPreferredTheme())

        document.querySelectorAll('[data-bs-theme-value]')
          .forEach(toggle => {
            toggle.addEventListener('click', () => {
              const theme = toggle.getAttribute('data-bs-theme-value')
              setStoredTheme(theme)
              setTheme(theme)
              showActiveTheme(theme, true)
            })
          })
      })
    })()
  </script>
</body>
